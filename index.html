<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Shutter Analytics Dashboard</title>
    <!-- Chart.js for rendering graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for parsing Google Sheets CSV data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-orange: #fb923c;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 24px; min-height: 100vh; }
        .header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .header h1 { font-size: 1.5rem; color: var(--accent-blue); }
        .controls { display: flex; gap: 16px; margin-bottom: 24px; background: var(--panel-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); align-items: center; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }
        select { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; outline: none; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .card { background: var(--panel-bg); border-radius: 10px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--text-sub); display: flex; justify-content: space-between; }
        .badge { background: #0369a1; color: #e0f2fe; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background-color: var(--bg-dark); color: var(--text-sub); text-transform: uppercase; font-weight: 600; font-size: 0.75rem; }
        th:first-child, td:first-child { text-align: left; }
        .status-pass { color: var(--accent-green); font-weight: 600; }
        .status-warn { color: var(--accent-orange); font-weight: 600; }
        .status-fail { color: var(--accent-red); font-weight: 600; }
        .error-msg { background: #7f1d1d; color: #fecaca; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📷 Live Shutter Tester Web Dashboard</h1>
        <div id="cameraDirectionBadge" class="badge">Awaiting Data</div>
    </div>

    <div id="errorBox" class="error-msg" style="display: none;"></div>

    <div class="controls">
        <div class="control-group">
            <label for="cameraSelect">Select Camera Model</label>
            <select id="cameraSelect" onchange="updateDashboard()">
                <!-- Populated via JS -->
            </select>
        </div>
        <div style="margin-left: auto;">
            <button onclick="fetchLiveData()" style="background: var(--accent-blue); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;">↻ Refresh Data</button>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Curtain Speed Consistency <span>(Travel Time in ms)</span></h2>
            <div class="chart-container">
                <canvas id="curtainSpeedChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Exposure Uniformity <span>(Curtain Diff EV)</span></h2>
            <div class="chart-container">
                <canvas id="evDiffChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Detailed Diagnostics Table</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Setting</th>
                    <th>Pos 1 (ms)</th>
                    <th>Pos 2 (ms)</th>
                    <th>Pos 3 (ms)</th>
                    <th>Curtain 1 (ms)</th>
                    <th>Curtain 2 (ms)</th>
                    <th>EV Diff</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated via JS -->
            </tbody>
        </table>
    </div>

    <script>
        // Connected directly to your published Google Sheets CSV link
        const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSv4EOxNXrHJtInRlmwuUXfZs6M5s0AkeEwAG4tBiUPBWOTO1H75pdWFZHPRasVLg/pub?gid=154322118&single=true&output=csv";

        let globalData = {};
        let speedChart, evChart;

        async function fetchLiveData() {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';

            try {
                const response = await fetch(GOOGLE_SHEETS_CSV_URL);
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        globalData = parseShutterExcelStructure(results.data);
                        populateCameraDropdown();
                        updateDashboard();
                    }
                });
            } catch (err) {
                errorBox.innerHTML = "❌ Failed to fetch Google Sheets CSV: " + err.message;
                errorBox.style.display = 'block';
            }
        }

        function parseShutterExcelStructure(rows) {
            let dataDict = {};
            let currentCamera = "Unknown Camera";
            let currentDirection = "HORIZONTAL";

            for (let i = 0; i < rows.length; i++) {
                let row = rows[i];
                let val0 = row[0] ? row[0].toString().trim() : "";
                let val1 = row[1] ? row[1].toString().trim() : "";

                if (val0.startsWith("CAMERA MODEL:")) {
                    currentCamera = val1 || "Unknown Camera";
                    if (!dataDict[currentCamera]) {
                        dataDict[currentCamera] = { direction: "HORIZONTAL", readings: [] };
                    }
                } else if (val0.startsWith("CURTAIN DIRECTION:")) {
                    currentDirection = val1 || "HORIZONTAL";
                    if (dataDict[currentCamera]) {
                        dataDict[currentCamera].direction = currentDirection;
                    }
                } else {
                    let pos1 = parseFloat(row[0]);
                    let c1 = parseFloat(row[6]);
                    let c2 = parseFloat(row[7]);
                    let evDiff = parseFloat(row[8]);
                    let setting = row[9] ? row[9].toString().trim() : "";

                    if (!isNaN(pos1) && !isNaN(c1) && setting !== "") {
                        if (!dataDict[currentCamera]) {
                            dataDict[currentCamera] = { direction: currentDirection, readings: [] };
                        }
                        dataDict[currentCamera].readings.push({
                            shutter_setting: setting,
                            left_top_ms: pos1,
                            mid_ms: parseFloat(row[1]) || 0,
                            right_bot_ms: parseFloat(row[2]) || 0,
                            curtain1_ms: c1,
                            curtain2_ms: c2,
                            curtain_diff_ev: isNaN(evDiff) ? 0 : evDiff
                        });
                    }
                }
            }
            return dataDict;
        }

        function populateCameraDropdown() {
            const select = document.getElementById('cameraSelect');
            select.innerHTML = '';
            Object.keys(globalData).forEach(cam => {
                const opt = document.createElement('option');
                opt.value = cam;
                opt.textContent = cam;
                select.appendChild(opt);
            });
        }

        function updateDashboard() {
            const selectedCam = document.getElementById('cameraSelect').value;
            if (!selectedCam || !globalData[selectedCam]) return;

            const camData = globalData[selectedCam];
            document.getElementById('cameraDirectionBadge').textContent = camData.direction + " TRAVEL";

            const labels = camData.readings.map(r => r.shutter_setting);
            const c1Ms = camData.readings.map(r => r.curtain1_ms);
            const c2Ms = camData.readings.map(r => r.curtain2_ms);
            const evDiff = camData.readings.map(r => r.curtain_diff_ev);

            if (speedChart) speedChart.destroy();
            speedChart = new Chart(document.getElementById('curtainSpeedChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Curtain 1 (ms)', data: c1Ms, borderColor: '#38bdf8', backgroundColor: '#38bdf8', tension: 0.2 },
                        { label: 'Curtain 2 (ms)', data: c2Ms, borderColor: '#fb923c', backgroundColor: '#fb923c', tension: 0.2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#f8fafc' } } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' }, title: { display: true, text: 'Time (ms)', color: '#94a3b8' } }
                    }
                }
            });

            if (evChart) evChart.destroy();
            evChart = new Chart(document.getElementById('evDiffChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Curtain Diff (EV)', data: evDiff, borderColor: '#4ade80', backgroundColor: '#4ade80', tension: 0.2 },
                        { label: 'Upper Limit (+0.33 EV)', data: Array(labels.length).fill(0.33), borderColor: '#f87171', borderDash: [5, 5], pointRadius: 0 },
                        { label: 'Lower Limit (-0.33 EV)', data: Array(labels.length).fill(-0.33), borderColor: '#f87171', borderDash: [5, 5], pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#f8fafc' } } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' }, title: { display: true, text: 'EV Deviation', color: '#94a3b8' } }
                    }
                }
            });

            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';
            camData.readings.forEach(r => {
                const tr = document.createElement('tr');
                const absEv = Math.abs(r.curtain_diff_ev);
                let statusClass = 'status-pass';
                let statusText = 'PASS';

                if (absEv > 0.66) { statusClass = 'status-fail'; statusText = 'ACTION REQ'; }
                else if (absEv > 0.33) { statusClass = 'status-warn'; statusText = 'MARGINAL'; }

                tr.innerHTML = `
                    <td><strong>${r.shutter_setting}</strong></td>
                    <td>${r.left_top_ms}</td>
                    <td>${r.mid_ms}</td>
                    <td>${r.right_bot_ms}</td>
                    <td>${r.curtain1_ms}</td>
                    <td>${r.curtain2_ms}</td>
                    <td>${r.curtain_diff_ev.toFixed(3)}</td>
                    <td class="${statusClass}">${statusText}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = fetchLiveData;
    </script>
</body>
</html>
